# Configuration du CMS (Decap CMS) — accessible sur /admin une fois le site déployé.

backend:
  name: git-gateway
  branch: main

# Pour tester le CMS en local : décommentez la ligne suivante, lancez `npx decap-server`
# dans un terminal et `npm start` dans un autre, puis ouvrez http://localhost:8080/admin/
# local_backend: true

locale: "fr"
media_folder: "src/assets/img"
public_folder: "/assets/img"
publish_mode: simple

collections:
  # ───────────── 1. La base des événements (une fiche par événement) ─────────────
  - name: "events"
    label: "Événements"
    label_singular: "Événement"
    description: "Une fiche par événement : visuel, description, intervenants, lien YouTube. Le site les affiche du plus récent au plus ancien."
    folder: "src/events"
    extension: "md"
    format: "yaml-frontmatter"
    create: true
    identifier_field: "title_fr"
    slug: "{{fields.number}}-{{slug}}"
    media_folder: "/src/assets/img/events"
    public_folder: "/assets/img/events"
    summary: "#{{number}} — {{title_fr}} ({{event_date}})"
    sortable_fields: ["event_date", "number", "title_fr"]
    fields:
      - { label: "Numéro de l'édition", name: "number", widget: "number", value_type: "int", min: 1, hint: "Ex. 31 pour « X-IA #31 »" }
      - { label: "Date", name: "event_date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD" }
      - { label: "Horaires", name: "time", widget: "string", required: false, hint: "Ex. 19h–23h" }
      - { label: "Lieu", name: "venue", widget: "string", required: false, hint: "Ex. 22 avenue Montaigne, 75008 Paris" }
      - { label: "Visuel", name: "image", widget: "image", required: false, hint: "Bannière au format 3:1 (ex. 1100 × 367 px)" }
      - { label: "Titre (français)", name: "title_fr", widget: "string" }
      - { label: "Title (English)", name: "title_en", widget: "string" }
      - { label: "Description (français)", name: "description_fr", widget: "text" }
      - { label: "Description (English)", name: "description_en", widget: "text" }
      - label: "Intervenants"
        name: "speakers"
        widget: "list"
        required: false
        summary: "{{fields.name}}"
        fields:
          - { label: "Nom (intervenant ou organisation)", name: "name", widget: "string" }
          - { label: "Précision (fonction, société…)", name: "detail", widget: "string", required: false }
      - { label: "Lien YouTube de l'enregistrement", name: "youtube", widget: "string", required: false, hint: "Lien de la vidéo. Laissé vide, la fiche renvoie vers la playlist YouTube." }

  # ───────────── 2. Les soutiens (logos) ─────────────
  - name: "supporters"
    label: "Ils soutiennent notre action"
    media_folder: "/src/assets/img/supporters"
    public_folder: "/assets/img/supporters"
    files:
      - name: "supporters"
        label: "Logos des entreprises"
        file: "src/_data/supporters.yaml"
        fields:
          - label: "Entreprises"
            name: "items"
            widget: "list"
            summary: "{{fields.name}}"
            fields:
              - { label: "Nom", name: "name", widget: "string" }
              - { label: "Logo", name: "logo", widget: "image", required: false, hint: "Sans logo, le nom s'affiche en lettres." }
              - { label: "Site web (lien)", name: "url", widget: "string", required: false }

  # ───────────── 3. Les textes du site, par langue ─────────────
  - name: "texts"
    label: "Textes du site"
    files:
      - name: "fr"
        label: "Textes — Français"
        file: "src/_data/i18n/fr.yaml"
        fields: &text_fields
          - label: "Référencement (Google)"
            name: "meta"
            widget: "object"
            fields:
              - { label: "Titre de l'onglet", name: "title", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
          - label: "Menu"
            name: "nav"
            widget: "object"
            fields:
              - { label: "Qui sommes-nous", name: "about", widget: "string" }
              - { label: "Événements", name: "events", widget: "string" }
              - { label: "Soutiens", name: "supporters", widget: "string" }
              - { label: "Contacts", name: "contact", widget: "string" }
              - { label: "Libellé du bouton menu (mobile)", name: "menu", widget: "string" }
          - label: "Accueil"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Petite ligne au-dessus du titre", name: "eyebrow", widget: "string" }
              - { label: "Titre", name: "title", widget: "string" }
              - { label: "Définition en quelques mots", name: "lead", widget: "text" }
              - { label: "Accroche", name: "tagline", widget: "string" }
              - { label: "Bouton « événements »", name: "cta_events", widget: "string" }
              - { label: "Bouton « rejoindre »", name: "cta_join", widget: "string" }
              - label: "Repères chiffrés"
                name: "facts"
                widget: "list"
                summary: "{{fields.value}} — {{fields.label}}"
                fields:
                  - { label: "Valeur", name: "value", widget: "string" }
                  - { label: "Libellé", name: "label", widget: "string" }
          - label: "Qui sommes-nous"
            name: "about"
            widget: "object"
            fields:
              - { label: "Petite ligne au-dessus du titre", name: "eyebrow", widget: "string" }
              - { label: "Grand titre", name: "headline", widget: "string" }
              - { label: "Valeur fondatrice", name: "statement", widget: "text" }
              - { label: "Mission", name: "mission", widget: "text" }
              - label: "Fiche d'identité"
                name: "facts"
                widget: "list"
                summary: "{{fields.term}}"
                fields:
                  - { label: "Rubrique", name: "term", widget: "string" }
                  - { label: "Texte", name: "text", widget: "text" }
          - label: "Section événements (libellés)"
            name: "events"
            widget: "object"
            fields:
              - { label: "Titre", name: "title", widget: "string" }
              - { label: "Introduction", name: "intro", widget: "text" }
              - { label: "Lien « toutes les captations »", name: "all_label", widget: "string" }
              - { label: "Libellé « Intervenants »", name: "speakers", widget: "string" }
              - { label: "Bouton avec lien vidéo", name: "watch", widget: "string" }
              - { label: "Bouton sans lien vidéo (playlist)", name: "playlist", widget: "string" }
              - { label: "Titre « événements précédents »", name: "archive", widget: "string" }
              - { label: "Texte si pas de visuel", name: "no_image", widget: "string" }
          - label: "Section soutiens (libellés)"
            name: "supporters"
            widget: "object"
            fields:
              - { label: "Titre", name: "title", widget: "string" }
              - { label: "Introduction", name: "intro", widget: "text" }
              - { label: "Phrase d'appel", name: "cta_text", widget: "string" }
              - { label: "Lien d'appel", name: "cta_link", widget: "string" }
          - label: "Contacts"
            name: "contact"
            widget: "object"
            fields:
              - { label: "Titre de section", name: "title", widget: "string" }
              - label: "Comment nous rejoindre"
                name: "join"
                widget: "object"
                fields:
                  - { label: "Petite ligne", name: "kicker", widget: "string" }
                  - { label: "Titre", name: "title", widget: "string" }
                  - { label: "Introduction", name: "intro", widget: "text" }
                  - label: "Étapes"
                    name: "steps"
                    widget: "list"
                    field: { label: "Étape", name: "step", widget: "text" }
                  - { label: "Note", name: "note", widget: "string" }
                  - { label: "Bouton", name: "button", widget: "string" }
                  - { label: "Phrase pour les non-polytechniciens", name: "other", widget: "text" }
              - label: "Formulaire de contact"
                name: "form"
                widget: "object"
                fields:
                  - { label: "Titre", name: "title", widget: "string" }
                  - { label: "Introduction", name: "intro", widget: "text" }
                  - { label: "Champ « Nom »", name: "name", widget: "string" }
                  - { label: "Champ « Email »", name: "email", widget: "string" }
                  - { label: "Champ « Organisation »", name: "organisation", widget: "string" }
                  - { label: "Champ « Sujet »", name: "subject", widget: "string" }
                  - label: "Choix du sujet"
                    name: "subjects"
                    widget: "list"
                    summary: "{{fields.label}}"
                    fields:
                      - { label: "Code (ne pas modifier)", name: "value", widget: "string" }
                      - { label: "Libellé", name: "label", widget: "string" }
                  - { label: "Champ « Message »", name: "message", widget: "string" }
                  - { label: "Bouton d'envoi", name: "submit", widget: "string" }
                  - { label: "Message pendant l'envoi", name: "sending", widget: "string" }
                  - { label: "Message de succès", name: "success", widget: "string" }
                  - { label: "Début du message d'erreur (suivi de l'email)", name: "error", widget: "string" }
                  - { label: "Mention sur les données", name: "privacy", widget: "string" }
          - label: "Pied de page"
            name: "footer"
            widget: "object"
            fields:
              - { label: "Ligne de mention", name: "line", widget: "string" }
              - { label: "Lien YouTube", name: "youtube", widget: "string" }
              - { label: "Lien LinkedIn", name: "linkedin", widget: "string" }
              - { label: "Lien « haut de page »", name: "top", widget: "string" }
          - label: "Page introuvable (404)"
            name: "notfound"
            widget: "object"
            fields:
              - { label: "Titre", name: "title", widget: "string" }
              - { label: "Texte", name: "text", widget: "string" }
              - { label: "Lien de retour", name: "back", widget: "string" }
          - label: "Page « message envoyé »"
            name: "thanks"
            widget: "object"
            fields:
              - { label: "Titre", name: "title", widget: "string" }
              - { label: "Texte", name: "text", widget: "string" }
              - { label: "Lien de retour", name: "back", widget: "string" }
      - name: "en"
        label: "Textes — English"
        file: "src/_data/i18n/en.yaml"
        fields: *text_fields

  # ───────────── 4. Réglages communs ─────────────
  - name: "settings"
    label: "Réglages"
    media_folder: "/src/assets/img"
    public_folder: "/assets/img"
    files:
      - name: "site"
        label: "Réglages communs"
        file: "src/_data/site.yaml"
        fields:
          - { label: "Logo", name: "logo", widget: "image" }
          - { label: "Email de contact (affiché dans le pied de page)", name: "contact_email", widget: "string" }
          - { label: "Lien de la playlist YouTube", name: "youtube_playlist", widget: "string" }
          - { label: "Lien LinkedIn", name: "linkedin", widget: "string" }
          - { label: "Lien de la page X-IA sur le site de l'AX", name: "ax_url", widget: "string" }
