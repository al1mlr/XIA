about:
  eyebrow: "About us"
  headline: "No bullshit."
  statement: "Our founding value: deeply technical, pragmatic exchanges grounded in real-world practice. Every talk goes through a rigorous review process."
  mission: "To bring together École Polytechnique alumni and their associates who work in, or are passionate about, artificial intelligence. The result: a community of trust where decision-makers and experts openly share what it really takes to put AI into production."
  facts:
    - term: "Status"
      text: "A group of the AX, the École Polytechnique alumni association, and a non-profit association under the French law of 1901."
    - term: "Format"
      text: "8 to 10 evenings a year: 3 to 4 talks from researchers and companies, followed by a buffet reception to talk it over."
    - term: "Recordings"
      text: "Every evening is filmed and made available to members and on our public YouTube channel, beyond the Polytechnique circle."
    - term: "Ground rules"
      text: "No for-profit activity, no religious or political topics."
