about:
  eyebrow: "Qui sommes-nous"
  headline: "No bullshit."
  statement: "Notre valeur fondatrice : des échanges profondément techniques, pragmatiques, tournés vers les réalités du terrain. Chaque présentation suit un processus de revue rigoureux."
  mission: "Fédérer la communauté des anciens élèves de l'École Polytechnique et de leurs associés, qui travaillent dans l'intelligence artificielle ou s'y passionnent. Le résultat : une communauté de confiance où décideurs et experts partagent librement leurs retours d'expérience sur la mise en production de l'IA."
  facts:
    - term: "Statut"
      text: "Groupe de l'AX, l'association des anciens élèves de Polytechnique, et association loi 1901 sans but lucratif."
    - term: "Format"
      text: "8 à 10 soirées par an : 3 à 4 présentations de chercheurs et d'entreprises, suivies d'un cocktail dînatoire pour échanger."
    - term: "Captation"
      text: "Chaque soirée est filmée, accessible aux membres et sur notre chaîne YouTube publique, au-delà du cercle des polytechniciens."
    - term: "Règles du jeu"
      text: "Aucune activité lucrative, aucun sujet confessionnel ou politique."
